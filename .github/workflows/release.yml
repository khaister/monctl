name: release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build release binary
        run: swift build -c release

      - name: Package binary
        run: |
          mkdir -p dist
          zip -j "dist/monctl-${{ github.ref_name }}-macos.zip" .build/release/monctl

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/monctl-${{ github.ref_name }}-macos.zip" --generate-notes
