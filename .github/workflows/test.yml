name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftFormat and SwiftLint
        run: brew install swiftformat swiftlint

      - name: Check formatting
        run: swiftformat --lint .

      - name: Run SwiftLint
        run: swiftlint lint

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build monctl
        run: swift build

      - name: Run Swift unit tests (mode selection)
        run: swift test

      - name: Run hardware-independent CLI tests
        run: MONCTL_BINARY=.build/debug/monctl python3 Tests/Integration/test_cli.py
