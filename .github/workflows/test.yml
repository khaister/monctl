name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build monctl
        run: swift build

      - name: Run Swift unit tests (mode selection)
        run: swift test

      - name: Run hardware-independent CLI tests
        run: MONCTL_BINARY=.build/debug/monctl python3 tests/unit/test_cli.py
